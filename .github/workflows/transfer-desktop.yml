# Installed in the public binary-only devflow-org/devflow-releases repository.
# The input URL grants short-lived access to ONE already approved binary asset.
name: Transfer verified desktop installer
on:
  workflow_dispatch:
    inputs:
      download_url:
        description: Short-lived GitHub release-assets URL for the tested installer
        required: true
      sha256:
        description: Expected SHA-256 from the private build
        required: true
      filename:
        description: Installer filename
        required: true
      release_tag:
        description: Existing draft desktop release tag
        required: true
permissions:
  contents: write
concurrency:
  group: transfer-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify installer
        env:
          ASSET_URL: ${{ inputs.download_url }}
          ASSET_SHA: ${{ inputs.sha256 }}
          ASSET_NAME: ${{ inputs.filename }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.parse, urllib.request
          name, digest, url, tag = (os.environ[k] for k in ('ASSET_NAME','ASSET_SHA','ASSET_URL','RELEASE_TAG'))
          match = re.fullmatch(r'DevFlow-Desktop-(\d+\.\d+\.\d+)-(?:mac-arm64\.dmg|windows-x64-setup\.exe)', name)
          if not match or tag != 'desktop-v' + match.group(1): raise SystemExit('Invalid installer name/tag')
          if not re.fullmatch(r'[0-9a-f]{64}', digest): raise SystemExit('Invalid checksum')
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or parsed.hostname != 'release-assets.githubusercontent.com' or parsed.username or parsed.password:
            raise SystemExit('Only signed GitHub release-asset downloads are allowed')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirect())
          output = pathlib.Path('output'); output.mkdir()
          total=0; actual=hashlib.sha256()
          with opener.open(url, timeout=120) as response, (output/name).open('wb') as destination:
            while chunk := response.read(1024*1024):
              total += len(chunk)
              if total >= 2*1024**3: raise SystemExit('Asset exceeds release size limit')
              actual.update(chunk); destination.write(chunk)
          if actual.hexdigest() != digest: raise SystemExit('Checksum mismatch; upload blocked')
          (output/(name+'.sha256')).write_text(digest+'  '+name+'\n')
          print(f'Verified {name}: {total} bytes, SHA-256 {digest}')
          PY
      - name: Upload to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.filename }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time, urllib.parse
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          if repo != 'devflow-org/devflow-releases': raise SystemExit('Unexpected distribution repository')
          def gh(*args):
            return subprocess.check_output(['gh', *args], text=True, timeout=45)
          def release():
            rows = json.loads(gh('api', f'repos/{repo}/releases?per_page=100'))
            result = next(r for r in rows if r['tag_name'] == tag)
            if not result['draft']: raise SystemExit('Only draft releases may receive assets')
            return result
          # Explicit limits and progress make a stalled large upload observable.
          # After an ambiguous failure, inspect the server before any retry.
          for name in (os.environ['ASSET_NAME'], os.environ['ASSET_NAME'] + '.sha256'):
            file = pathlib.Path('output') / name
            expected = 'sha256:' + hashlib.file_digest(file.open('rb'), 'sha256').hexdigest()
            size = file.stat().st_size
            def verified(asset):
              if asset['state'] != 'uploaded': return False
              if asset.get('digest') != expected or asset['size'] != size:
                raise SystemExit('Existing asset differs from verified file: ' + name)
              return True
            for attempt in range(3):
              current = release()
              asset = next((a for a in current['assets'] if a['name'] == name), None)
              if asset and verified(asset): break
              if asset:
                gh('api', '--method', 'DELETE', f"repos/{repo}/releases/assets/{asset['id']}")
              url = f"https://uploads.github.com/repos/{repo}/releases/{current['id']}/assets?" + urllib.parse.urlencode({'name': name})
              print(f'Uploading {name}, {size} bytes, attempt {attempt + 1}', flush=True)
              result = subprocess.run([
                'curl', '--http1.1', '--fail-with-body', '--show-error',
                '--connect-timeout', '30', '--max-time', '480',
                '--speed-limit', '65536', '--speed-time', '60',
                '-H', 'Authorization: Bearer ' + os.environ['GH_TOKEN'],
                '-H', 'Content-Type: application/octet-stream',
                '--data-binary', '@' + str(file), '--output', 'upload-response.json', url,
              ], timeout=500)
              current = release()
              asset = next((a for a in current['assets'] if a['name'] == name), None)
              if asset and verified(asset): break
              print(f'Upload not confirmed (curl exit {result.returncode}); checking again before retry', flush=True)
              time.sleep(5)
            else:
              raise SystemExit('Upload failed; release remains a draft')
            print('Verified uploaded checksum and size: ' + name, flush=True)
          PY
