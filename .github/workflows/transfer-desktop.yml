# Installed in the public binary-only devflow-org/devflow-releases repository.
# The input URL grants short-lived access to ONE already approved binary asset.
name: Transfer verified desktop installer
on:
  workflow_dispatch:
    inputs:
      download_url:
        description: Short-lived GitHub release-assets URL for the tested installer
        required: true
      sha256:
        description: Expected SHA-256 from the private build
        required: true
      filename:
        description: Installer filename
        required: true
      release_tag:
        description: Existing draft desktop release tag
        required: true
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify installer
        env:
          ASSET_URL: ${{ inputs.download_url }}
          ASSET_SHA: ${{ inputs.sha256 }}
          ASSET_NAME: ${{ inputs.filename }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.parse, urllib.request
          name, digest, url, tag = (os.environ[k] for k in ('ASSET_NAME','ASSET_SHA','ASSET_URL','RELEASE_TAG'))
          match = re.fullmatch(r'DevFlow-Desktop-(\d+\.\d+\.\d+)-(?:mac-arm64\.dmg|windows-x64-setup\.exe)', name)
          if not match or tag != 'desktop-v' + match.group(1): raise SystemExit('Invalid installer name/tag')
          if not re.fullmatch(r'[0-9a-f]{64}', digest): raise SystemExit('Invalid checksum')
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or parsed.hostname != 'release-assets.githubusercontent.com' or parsed.username or parsed.password:
            raise SystemExit('Only signed GitHub release-asset downloads are allowed')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirect())
          output = pathlib.Path('output'); output.mkdir()
          total=0; actual=hashlib.sha256()
          with opener.open(url, timeout=120) as response, (output/name).open('wb') as destination:
            while chunk := response.read(1024*1024):
              total += len(chunk)
              if total >= 2*1024**3: raise SystemExit('Asset exceeds release size limit')
              actual.update(chunk); destination.write(chunk)
          if actual.hexdigest() != digest: raise SystemExit('Checksum mismatch; upload blocked')
          (output/(name+'.sha256')).write_text(digest+'  '+name+'\n')
          print(f'Verified {name}: {total} bytes, SHA-256 {digest}')
          PY
      - name: Upload to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.filename }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" "output/$ASSET_NAME" "output/$ASSET_NAME.sha256"
